name: Tech Radar Scheduler

"on":
  workflow_dispatch:
  schedule:
    # temporary scheduler validation
    # 12:00 WIB is 05:00 UTC.
    - cron: "*/5 * * * *"

jobs:
  run-tech-radar:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache processed URL history
        uses: actions/cache@v4
        with:
          path: processed_urls.txt
          key: processed-urls-${{ github.database_id }}
          restore-keys: |
            processed-urls-${{ github.database_id }}

      - name: Ensure processed URL file exists
        run: touch processed_urls.txt

      - name: Run tech radar
        run: cargo run --locked
